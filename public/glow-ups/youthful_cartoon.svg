<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded container background -->
  <rect width="200" height="200" fill="#FFF5F7" rx="32" />
  
  <g transform="translate(100, 100)">
    
      <!-- Base Face with squiggly plump cheeks -->
      <path d="M 0 -75 C 40 -75 60 -40 60 0 C 60 10 75 20 75 35 C 75 50 60 60 50 65 C 30 75 0 75 0 75 C 0 75 -30 75 -50 65 C -60 60 -75 50 -75 35 C -75 20 -60 10 -60 0 C -60 -40 -40 -75 0 -75 Z" fill="#FFFBF0" stroke="#2D3748" stroke-width="5" stroke-linejoin="round" />
      
      <!-- Squiggle motion lines next to cheeks -->
      <path d="M -85 20 Q -95 30 -85 40" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" />
      <path d="M 85 20 Q 95 30 85 40" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" />
      
      <!-- Cheeks -->
      <ellipse cx="-40" cy="20" rx="12" ry="8" fill="#FFB6C1" opacity="0.6" />
      <ellipse cx="40" cy="20" rx="12" ry="8" fill="#FFB6C1" opacity="0.6" />
      
      <!-- Eyes & Smile -->
      <circle cx="-20" cy="-5" r="5" fill="#2D3748" />
      <circle cx="20" cy="-5" r="5" fill="#2D3748" />
      
      <!-- Wavy smile -->
      <path d="M -15 25 Q -5 35 0 25 Q 5 35 15 25" fill="none" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />
    
  </g>
</svg>