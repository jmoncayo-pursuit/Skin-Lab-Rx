<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded container background -->
  <rect width="200" height="200" fill="#F0FFF4" rx="32" />
  
  <g transform="translate(100, 100)">
    
      <!-- Base Face with split line -->
      <ellipse cx="0" cy="0" rx="60" ry="75" fill="#FFFBF0" stroke="#2D3748" stroke-width="5" />
      <line x1="0" y1="-75" x2="0" y2="75" stroke="#2D3748" stroke-width="3" />
      
      <!-- Dots/Pores on the right side -->
      <circle cx="25" cy="-30" r="3" fill="#A0AEC0" />
      <circle cx="40" cy="-10" r="2" fill="#A0AEC0" />
      <circle cx="15" cy="10" r="4" fill="#A0AEC0" />
      <circle cx="35" cy="30" r="3" fill="#A0AEC0" />
      <circle cx="20" cy="45" r="2" fill="#A0AEC0" />
      <circle cx="45" cy="15" r="2.5" fill="#A0AEC0" />
      
      <!-- Cheeks -->
      <ellipse cx="-30" cy="15" rx="10" ry="6" fill="#FFB6C1" opacity="0.6" />
      <ellipse cx="30" cy="15" rx="10" ry="6" fill="#FFB6C1" opacity="0.6" />
      
      <!-- Eyes & Smile -->
      <circle cx="-20" cy="-5" r="5" fill="#2D3748" />
      <circle cx="20" cy="-5" r="5" fill="#2D3748" />
      <path d="M -8 15 Q 0 25 8 15" fill="none" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />
      
      <!-- Magnifying glass icon top left -->
      <circle cx="-60" cy="-60" r="15" fill="#EBF8FF" stroke="#2D3748" stroke-width="3" />
      <line x1="-50" y1="-50" x2="-35" y2="-35" stroke="#2D3748" stroke-width="5" stroke-linecap="round" />
    
  </g>
</svg>